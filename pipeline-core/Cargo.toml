[package]
name = "fiftyone-pipeline-core"
version = "4.5.2"
description = "FlowData, FlowElement/Pipeline traits, Evidence, ElementData, TypedKey, errors and constants for the 51Degrees pipeline."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/build-your-own?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fiftyone-pipeline-core-cargo.toml&utm_term=homepage"

[dependencies]
# Error model. The `thiserror` derive gives us idiomatic std::error::Error
# implementations with source chaining, matching the C# exception hierarchy.
thiserror.workspace = true
# Case-insensitive, fast hashing for the evidence and element-data maps. The
# pipeline is used in high-traffic web servers, so a faster hasher than the
# default SipHash is worthwhile.
ahash.workspace = true
# Processing logs the errors it suppresses through the log facade, which does
# nothing until the application installs a logger.
log = "0.4"

[package.metadata.docs.rs]
# Build the documentation on docs.rs with every feature enabled, so the
# cloud, on-premise and optional paths are all documented.
all-features = true
