# A Worker that runs the cloud request engine's request path on workerd,
# the Workers runtime, driven by test.mjs through Miniflare. The engine
# sends its requests through a stub client in the Worker, so no request
# leaves it and no key is needed. It is a test harness kept out of the
# workspace, since it builds for wasm32-unknown-unknown only.
[package]
name = "cloud-request-engine-cloudflare-host-test"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fiftyone-cloud-request-engine = { path = "../..", default-features = false }
fiftyone-pipeline-core = { path = "../../../pipeline-core" }
worker = "0.8"
# ahash seeds itself at run time through getrandom, which builds for
# wasm32-unknown-unknown only with its JavaScript backend turned on.
getrandom = { version = "0.3", features = ["wasm_js"] }

[workspace]
