[package]
name = "fiftyone-device-detection-sys"
version = "4.5.2"
description = "Raw FFI bindings for Rust to the Device Detection and User-Agent parser in the 51Degrees C library. The Hash engine they bind reads a data file on your server to detect the device type and model, browser, operating system, and crawlers from the User-Agent and User-Agent Client Hints. Built on fiftyone-common-sys. For the safe API, use fiftyone-device-detection. An alternative to UAParser.js, DeviceAtlas, and WURFL."
keywords = ["user-agent", "user-agent-parser", "device-detection", "client-hints", "uaparser"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/device-detection?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fiftyone-device-detection-sys-cargo.toml&utm_term=homepage"
links = "fiftyone-device-detection-c"
build = "build.rs"
# The C sources under cxx are ignored by git, because
# ci/copy-cxx-sources.ps1 copies them from the cxx submodule before
# packaging, and cargo leaves an ignored directory out of a package unless
# the manifest lists it. A build in the workspace reads the submodule instead.
include = ["src/**", "cxx/**", "build.rs", "README.md"]

[dependencies]
fiftyone-common-sys = { version = "=4.5.2", path = "../common-sys" }

[build-dependencies]
cc = "1.2"

[package.metadata.docs.rs]
# Build the documentation on docs.rs with every feature enabled, so the
# cloud, on-premise and optional paths are all documented.
all-features = true
