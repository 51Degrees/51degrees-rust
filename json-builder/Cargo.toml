[package]
name = "fiftyone-json-builder"
version = "4.5.2"
description = "JSON serialization element for the 51Degrees pipeline."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/build-your-own?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fiftyone-json-builder-cargo.toml&utm_term=homepage"

[features]
# Re-export the engines data-update service (reqwest + notify) for native and
# on-premise consumers that refresh data files. Off by default so the crate
# carries no reqwest/notify and compiles for wasm32-wasip1.
data-update = ["fiftyone-pipeline-engines/data-update"]

[dependencies]
fiftyone-pipeline-core = { version = "4.5.2", path = "../pipeline-core" }
# default-features = false drops the engines data-update service (reqwest/notify),
# which this crate never uses, so it compiles for wasm32-wasip1. Enable the
# `data-update` feature to re-export it.
fiftyone-pipeline-engines = { version = "4.5.2", path = "../pipeline-engines", default-features = false }
# The sequence element, whose data holds the sequence number after it has added
# one to the request's value. Its default features carry no reqwest, so the
# crate still compiles for wasm32-wasip1.
fiftyone-pipeline-engines-fiftyone = { version = "4.5.2", path = "../pipeline-engines-fiftyone" }
# The cloud request engine's data key, which the JSON leaves out because its
# data is the raw cloud response. default-features = false keeps reqwest out, so
# the crate still compiles for wasm32-wasip1.
fiftyone-cloud-request-engine = { version = "4.5.2", path = "../cloud-request-engine", default-features = false }
# serde_json reads the output in this crate's tests. The writer does not use
# it. preserve_order stays on because Cargo turns a feature on for every crate
# built with this one, so removing it here would change the key order of
# serde_json maps elsewhere in the same build.
serde_json = { version = "1", features = ["preserve_order"] }
# The ordered map behind JsonObject, so the output keeps the order keys were
# added in.
indexmap = "2"

[package.metadata.docs.rs]
# Build the documentation on docs.rs with every feature enabled, so the
# cloud, on-premise and optional paths are all documented.
all-features = true
