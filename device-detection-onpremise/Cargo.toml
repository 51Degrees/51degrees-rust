[package]
name = "fiftyone-device-detection-onpremise"
version = "4.5.2"
description = "On-premise Device Detection engine and User-Agent parser for Rust. Reads a 51Degrees Hash data file on your server to detect the device type and model, browser, operating system, and crawlers from the User-Agent and User-Agent Client Hints. Built on the 51Degrees Pipeline API, over the safe fiftyone-native wrapper. An alternative to UAParser.js, DeviceAtlas, and WURFL."
keywords = ["user-agent", "user-agent-parser", "device-detection", "client-hints", "uaparser"]
categories = ["parser-implementations", "web-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/device-detection?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fiftyone-device-detection-onpremise-cargo.toml&utm_term=homepage"

[dependencies]
fiftyone-pipeline-core = { version = "=4.5.2", path = "../pipeline-core" }
fiftyone-pipeline-engines = { version = "=4.5.2", path = "../pipeline-engines" }
fiftyone-pipeline-engines-fiftyone = { version = "=4.5.2", path = "../pipeline-engines-fiftyone" }
fiftyone-device-detection-shared = { version = "=4.5.2", path = "../device-detection-shared" }
# Enable only the Device Detection product of the native wrapper. This links
# Device Detection's copy of the common C library alone and never pulls in the
# IP Intelligence copy, so the two ABI incompatible common C library builds
# never collide in a Device Detection binary.
fiftyone-native = { version = "=4.5.2", path = "../native", default-features = false, features = ["dd"] }
arc-swap.workspace = true
# Logs a refresh that fails through the log facade, which does nothing until
# the application installs a logger.
log = "0.4"

[dev-dependencies]
# The data file date tests build and compare header dates.
chrono.workspace = true

[package.metadata.docs.rs]
# Build the documentation on docs.rs with every feature enabled, so the
# cloud, on-premise and optional paths are all documented.
all-features = true
