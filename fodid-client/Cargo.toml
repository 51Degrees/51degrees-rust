[package]
name = "fodid-client"
version = "4.5.0"
description = "Client for the 51Did (51Degrees Identifier) two-step verification: fetches and caches the published signing keys, verifies a 51Did signature offline or through the cloud, and redeems the sealed creator context result a browser relays, with the typed outcomes the other 51Did packages report."
keywords = ["51degrees", "fodid", "51did", "identifier", "owid"]
categories = ["web-programming::http-client", "cryptography"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/developers/51did?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fodid-client-cargo.toml&utm_term=homepage"

[features]
# Compile the built-in asynchronous reqwest transport (ReqwestClient). Off
# by default so the crate builds without reqwest, and so for wasm32-wasip1
# where an edge runtime supplies its own DidHttpClient. Native consumers
# enable this to use the built-in client from a tokio runtime.
reqwest-client = ["dep:reqwest"]

[dependencies]
# The 51Did reader, which also carries the OWID envelope types the offline
# signature check verifies through.
fodid = { path = "../fodid", version = "4.5" }
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Asynchronous HTTP client for the built-in transport. rustls avoids a system
# OpenSSL dependency on Windows, and the form feature carries the url-encoded
# redeem body. Optional and gated behind the `reqwest-client` feature, because
# reqwest needs native sockets and a tokio runtime and so does not build for
# targets such as wasm32-wasip1, exactly as in the cloud request engine.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form"], optional = true }

[dev-dependencies]
# The tests create a real signed 51Did to stand in for the cloud, which needs
# the OWID creator types fodid exposes under its creator feature.
fodid = { path = "../fodid", version = "4.5", features = ["creator"] }
# The tests await the client on a current-thread runtime, which is what
# proves the futures need not be Send. The crate itself has no async runtime
# dependency.
tokio = { workspace = true, features = ["macros", "rt"] }

# The live cloud test (tests/live_cloud.rs) needs the built-in transport, so
# the crate depends on itself here with the feature on, and needs a blocking
# HTTP client of its own for the two calls that are not part of the client,
# being the cloud json endpoint that creates an identifier and the
# verify-context endpoint that a browser calls. Both are narrowed to targets
# that are not wasm, because a dev-dependency's features are chosen whatever
# --no-default-features says, and reqwest and ureq both need native sockets.
# The test file carries #![cfg(feature = "reqwest-client")] so it compiles to
# nothing where the feature is off.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
fodid-client = { path = ".", features = ["reqwest-client"] }
ureq = "2"

[package.metadata.docs.rs]
# Build the documentation on docs.rs with every feature enabled, so the
# built-in transport is documented alongside the trait it implements.
all-features = true
