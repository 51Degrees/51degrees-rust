[package]
name = "fiftyone-device-detection-property-keyed"
version = "4.5.2"
description = "Device Detection by TAC (Type Allocation Code) and native model name for Rust. TacEngine and NativeEngine find the hardware profiles that hold a TAC or a native model name, reading a 51Degrees Device Detection data file on your server. Built on the 51Degrees Pipeline API. An alternative to UAParser.js, DeviceAtlas, and WURFL."
keywords = ["device-detection", "tac", "user-agent", "user-agent-parser", "uaparser"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/device-detection?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fiftyone-device-detection-property-keyed-cargo.toml&utm_term=homepage"

[dependencies]
fiftyone-pipeline-core = { version = "=4.5.2", path = "../pipeline-core" }
# AspectEngine and AspectPropertyMetaData. default-features = false leaves out
# the data-update service, which these engines never use.
fiftyone-pipeline-engines = { version = "=4.5.2", path = "../pipeline-engines", default-features = false }
# MultiDeviceData, the hardware data the engines add their profiles to.
fiftyone-device-detection-shared = { version = "=4.5.2", path = "../device-detection-shared" }
# The on-premise Device Detection engine, whose data set holds the profiles.
fiftyone-device-detection-onpremise = { version = "=4.5.2", path = "../device-detection-onpremise" }
# Logs a key property the data file lacks or does not index through the log
# facade, which does nothing until the application installs a logger.
log = "0.4"

[dev-dependencies]
# The performance profile the data file tests open the data file with.
fiftyone-native = { path = "../native", default-features = false, features = ["dd"] }
# The JSON builder and the Sequence element it needs, so a test can check what
# the JSON builder writes for the engines' data.
fiftyone-json-builder = { path = "../json-builder" }
fiftyone-pipeline-engines-fiftyone = { path = "../pipeline-engines-fiftyone" }
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
