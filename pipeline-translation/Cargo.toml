[package]
name = "fiftyone-pipeline-translation"
version = "4.5.2"
description = "TranslationEngine: translates the values another element produced into the language the request asks for, for the 51Degrees pipeline."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/build-your-own?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fiftyone-pipeline-translation-cargo.toml&utm_term=homepage"

[dependencies]
fiftyone-pipeline-core = { version = "=4.5.2", path = "../pipeline-core" }
# AspectPropertyValue, so a translated property can say it has no value and
# why. default-features = false leaves out the data-update service, which this
# engine never uses.
fiftyone-pipeline-engines = { version = "=4.5.2", path = "../pipeline-engines", default-features = false }
# The translation sources are YAML files of `source: translation` lines. The
# parser is pure Rust, so the crate still builds for wasm32.
serde_norway.workspace = true

[package.metadata.docs.rs]
all-features = true
