[package]
name = "fiftyone-device-detection-shared"
version = "4.5.2"
description = "Device Detection and User-Agent parser types for Rust, shared by the cloud and on-premise engines. The DeviceData trait with typed accessors for the device type and model, browser, operating system, and crawlers, the property model, and the User-Agent Client Hints high-entropy evidence keys. Built on the 51Degrees Pipeline API. An alternative to UAParser.js, DeviceAtlas, and WURFL."
keywords = ["user-agent", "user-agent-parser", "device-detection", "client-hints", "uaparser"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/device-detection?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fiftyone-device-detection-shared-cargo.toml&utm_term=homepage"

[dependencies]
fiftyone-pipeline-core = { version = "=4.5.2", path = "../pipeline-core" }
# default-features = false drops the data-update service (reqwest/notify) from
# the shared data model, which never uses it, so the cloud crates that build on
# this one can reach wasm32-wasip1. On-premise builds re-enable it through the
# on-premise engine's own dependency.
fiftyone-pipeline-engines = { version = "=4.5.2", path = "../pipeline-engines", default-features = false }
base64.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
# Build the documentation on docs.rs with every feature enabled, so the
# cloud, on-premise and optional paths are all documented.
all-features = true
