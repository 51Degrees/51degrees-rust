[package]
name = "fiftyone-ip-intelligence-shared"
version = "4.5.2"
description = "IP Intelligence and IP geolocation types for Rust, shared by the cloud and on-premise engines. The IpIntelligenceData trait with weighted accessors for an IP address's likely location (country, region, town, and coordinates), connection type, and network. Built on the 51Degrees Pipeline API. An alternative to MaxMind and IPinfo."
keywords = ["ip-geolocation", "geoip", "asn", "maxmind", "ipinfo"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/ip-intelligence?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fiftyone-ip-intelligence-shared-cargo.toml&utm_term=homepage"

[dependencies]
fiftyone-pipeline-core = { version = "=4.5.2", path = "../pipeline-core" }
# default-features = false drops the data-update service (reqwest/notify) from
# the shared data model, which never uses it, so the cloud crates that build on
# this one can reach wasm32-wasip1. On-premise builds re-enable it through the
# on-premise engine's own dependency.
fiftyone-pipeline-engines = { version = "=4.5.2", path = "../pipeline-engines", default-features = false }

[dev-dependencies]
# A capturing logger for the test of what a read of a property logs.
log = "0.4"

[package.metadata.docs.rs]
# Build the documentation on docs.rs with every feature enabled, so the
# cloud, on-premise and optional paths are all documented.
all-features = true
