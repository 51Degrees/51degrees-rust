[package]
name = "fiftyone-ip-intelligence-translation"
version = "4.5.2"
description = "Translation engines for IP Intelligence: the English names of the countries an IP address may be in, those names in the language the request asks for, and every country ordered for that language, for the 51Degrees pipeline."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/ip-intelligence?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fiftyone-ip-intelligence-translation-cargo.toml&utm_term=homepage"

[dependencies]
fiftyone-pipeline-core = { version = "=4.5.2", path = "../pipeline-core" }
# AspectPropertyValue, so a property can say it has no value and why.
# default-features = false leaves out the data-update service, which these
# engines never use.
fiftyone-pipeline-engines = { version = "=4.5.2", path = "../pipeline-engines", default-features = false }
fiftyone-pipeline-translation = { version = "=4.5.2", path = "../pipeline-translation" }
# The data key the IP Intelligence engines write under.
fiftyone-ip-intelligence-shared = { version = "=4.5.2", path = "../ip-intelligence-shared" }
# The cloud engine reads the cloud request engine's response and accessible
# properties. default-features = false leaves out reqwest, so the crate still
# builds for wasm32.
fiftyone-cloud-request-engine = { version = "=4.5.2", path = "../cloud-request-engine", default-features = false }
# preserve_order keeps the cloud response's members in the order it gives
# them, which is the order the properties are listed in.
serde_json = { workspace = true, features = ["preserve_order"] }
once_cell.workspace = true
# Logs through the log facade, which does nothing until the application
# installs a logger.
log = "0.4"
# The list of every country is read from its YAML source in file order.
serde.workspace = true
serde_norway.workspace = true
# Sorts country names as the language asked for sorts them, with the Unicode
# collation data compiled in, so the crate needs no files and builds for
# wasm32.
icu_collator = "2.2"
icu_locale_core = "2.2"

[package.metadata.docs.rs]
all-features = true
