[package]
name = "fiftyone-pipeline-web"
version = "4.5.2"
description = "Framework-neutral web elements, client-side endpoint logic and the JavaScript/Mustache assets for the 51Degrees pipeline."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://51degrees.com/build-your-own?utm_source=docs.rs&utm_medium=package&utm_campaign=51degrees-rust&utm_content=fiftyone-pipeline-web-cargo.toml&utm_term=homepage"

[features]
# Re-export the engines data-update service for native and on-premise consumers.
# Off by default so a default build carries no reqwest/notify and reaches
# wasm32-wasip1.
data-update = ["fiftyone-pipeline-engines/data-update"]

[dependencies]
fiftyone-pipeline-core = { version = "=4.5.2", path = "../pipeline-core" }
# default-features = false drops the engines data-update service (reqwest/notify),
# which the web elements never use, so this crate compiles for wasm32-wasip1.
# Enable the `data-update` feature to re-export it.
fiftyone-pipeline-engines = { version = "=4.5.2", path = "../pipeline-engines", default-features = false }
fiftyone-pipeline-engines-fiftyone = { version = "=4.5.2", path = "../pipeline-engines-fiftyone" }
fiftyone-json-builder = { version = "=4.5.2", path = "../json-builder" }
fiftyone-javascript-builder = { version = "=4.5.2", path = "../javascript-builder" }
log = "0.4"
# ahash provides a fast hasher that can be seeded with fixed constants, giving
# the web ETag the same digest in every process running the same build. It is
# already a workspace dependency so it resolves to a single shared version.
ahash.workspace = true

[dev-dependencies]
# The Vary test drives a real cloud request engine through a fake transport.
# The JSON and JavaScript builders already depend on it.
fiftyone-cloud-request-engine = { version = "4.5.2", path = "../cloud-request-engine", default-features = false }

[package.metadata.docs.rs]
# Build the documentation on docs.rs with every feature enabled, so the
# cloud, on-premise and optional paths are all documented.
all-features = true
