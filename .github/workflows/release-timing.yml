name: Release Timing

# Times one commit against another on a single runner, which is what a release
# needs before it says whether it is slower than the release before it.
#
# The Nightly Performance workflow cannot answer that. It measures one branch
# and compares the figure with that branch's own history, and the shared
# comparison refuses to fail when there are too few historic results, so a run
# on `rc` or on a temporary branch can never fail however slow it is.
#
# This workflow builds both sides' on-premise performance examples on one
# runner, gives both the same data files, then runs them in turn for a number
# of rounds, turning the order each round so neither side always runs on a
# cold cache. `ci/compare-timing.ps1` then applies the release timing rule,
# under which a measure is slower only when the head's whole range sits below
# the base's, and fails the run when one is.

on:
  workflow_dispatch:
    inputs:
      base:
        description: The commit or branch to compare against, usually main.
        required: false
        default: main
      head:
        description: The commit or branch being released, usually rc.
        required: false
        default: rc
      rounds:
        description: Rounds of each engine on each side.
        required: false
        default: '30'

permissions:
  contents: read

jobs:
  timing:
    name: ${{ inputs.head }} against ${{ inputs.base }}
    runs-on: ubuntu-latest
    env:
      _51DEGREES_ROUNDS: ${{ inputs.rounds }}
    steps:
      - name: Checkout the base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base }}
          path: base
          submodules: recursive
          fetch-depth: 0

      - name: Checkout the head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          path: head
          submodules: recursive
          fetch-depth: 0

      # The free data files come from the assets common-ci fetches and keeps
      # in the Actions cache for the day, never from the data repository's
      # links. A file that is missing fails the job here.
      - name: Put the fetched data files in place
        uses: ./head/.github/actions/fetched-data-files
        with:
          root: head

      # Both sides must read the same bytes, or the comparison measures the
      # data files. The head's copies of the evidence are put where the base
      # looks for them, in its data repository at cxx/data.
      - name: Give both sides the same data files
        shell: bash
        run: |
          set -euo pipefail
          d="${GITHUB_WORKSPACE}/head/cxx/data"
          for f in "$d/device-detection/51Degrees-LiteV4.1.hash" \
                   "$d/device-detection/20000 Evidence Records.yml" \
                   "$d/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi" \
                   "$d/ip-intelligence/evidence.yml"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing, so the two sides would read different data"
              exit 1
            fi
          done
          for folder in device-detection ip-intelligence; do
            if [ ! -d "base/cxx/data/$folder" ]; then
              echo "::error::The base has no cxx/data/$folder, so it cannot be given the head's evidence"
              exit 1
            fi
          done
          cp "$d/device-detection/20000 Evidence Records.yml" \
             "base/cxx/data/device-detection/20000 Evidence Records.yml"
          cp "$d/ip-intelligence/evidence.yml" base/cxx/data/ip-intelligence/evidence.yml
          sha256sum "$d/device-detection/51Degrees-LiteV4.1.hash" \
            "$d/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi" \
            "$d/device-detection/20000 Evidence Records.yml" \
            "base/cxx/data/device-detection/20000 Evidence Records.yml" \
            "$d/ip-intelligence/evidence.yml" \
            base/cxx/data/ip-intelligence/evidence.yml
          # Both sides read these names, so each reads the same files.
          echo "_51DEGREES_DD_PATH=$d/device-detection/51Degrees-LiteV4.1.hash" >> "$GITHUB_ENV"
          echo "_51DEGREES_IPI_PATH=$d/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi" >> "$GITHUB_ENV"

      # The comparison script comes from the ref this run was started on, not
      # from either side, because a head being timed need not carry it.
      - name: Checkout the scripts this run uses
        uses: actions/checkout@v4
        with:
          path: scripts

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build both sides' performance examples in release
        shell: pwsh
        run: |
          rustc --version
          foreach ($side in 'base', 'head') {
            Write-Host "Building $side"
            & "./$side/ci/test-examples-against-source.ps1" -Command {
              cargo build --release --config source.toml -p device-detection-examples --bin dd-onprem-performance
              cargo build --release --config source.toml -p ip-intelligence-examples --bin ipi-onprem-performance
            }
          }

      - name: Run the two sides in turn
        shell: bash
        run: |
          set -uo pipefail
          nproc
          lscpu | grep -E 'Model name' || true
          bin() { find "$GITHUB_WORKSPACE/$1/examples/target/release" -maxdepth 1 -type f -name "$2" | head -1; }
          for side in base head; do
            for b in dd-onprem-performance ipi-onprem-performance; do
              p=$(bin "$side" "$b")
              if [ ! -x "$p" ]; then echo "::error::$side $b was not built"; exit 1; fi
              echo "BINARY $side $b $p"
            done
          done
          mkdir -p out
          : > out/results.txt
          for round in $(seq 1 "$_51DEGREES_ROUNDS"); do
            if [ $((round % 2)) -eq 1 ]; then order="base head"; else order="head base"; fi
            for side in $order; do
              f="$GITHUB_WORKSPACE/out/dd-$side-$round.txt"
              if ! (cd "$side/examples" && "$(bin "$side" dd-onprem-performance)" > "$f" 2>&1); then
                echo "::error::Device Detection $side round $round failed"; cat "$f"; exit 1
              fi
              v=$(grep -E 'Detections per second' "$f" | tail -1 | grep -oE '[0-9]+$')
              n=$(grep -E 'Detections +:' "$f" | tail -1 | grep -oE '[0-9]+$')
              echo "RESULT dd $round $side $v detections $n" | tee -a out/results.txt
            done
            for side in $order; do
              f="$GITHUB_WORKSPACE/out/ipi-$side-$round.txt"
              if ! (cd "$side/examples" && "$(bin "$side" ipi-onprem-performance)" > "$f" 2>&1); then
                echo "::error::IP Intelligence $side round $round failed"; cat "$f"; exit 1
              fi
              s=$(grep -A4 'Single-threaded result' "$f" | grep -oE 'Throughput: [0-9]+' | grep -oE '[0-9]+')
              m=$(grep -A4 'Multi-threaded result' "$f" | grep -oE 'Throughput: [0-9]+' | grep -oE '[0-9]+')
              l=$(grep -oE 'Loaded [0-9]+' "$f" | grep -oE '[0-9]+')
              echo "RESULT ipi $round $side $m single $s loaded $l" | tee -a out/results.txt
            done
          done
          for f in out/dd-base-1.txt out/dd-head-1.txt out/ipi-base-1.txt out/ipi-head-1.txt; do
            echo "===== $f"; sed -n '1,40p' "$f"
          done

      # The gate. It fails the run when a measure's whole range sits below the
      # base's, and when a measure has fewer paired rounds than were asked for.
      - name: Compare the two sides under the release timing rule
        shell: pwsh
        run: ./scripts/ci/compare-timing.ps1 -Log out/results.txt -Rounds ${{ inputs.rounds }}

      - name: Keep the rounds' output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-timing
          path: out/
          if-no-files-found: error
