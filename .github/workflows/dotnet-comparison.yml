name: Comparison with .NET

# Runs the crates and the .NET packages over the corpus in parity/ and fails
# on any difference that parity/allowed-differences.json does not list with
# its reason. parity/README.md describes the programs and the line format.
#
# The lite job uses the free data files the cxx submodule carries. The
# enterprise job uses the Enterprise files, fetched with the license keys
# when they are available to the run, and is skipped with a warning when
# they are not.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: dotnet-comparison-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  compare:
    name: compare (${{ matrix.data }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        data: [lite, enterprise]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Lite files are Git LFS content inside the data submodules.
      - name: Fetch LFS data for the cxx submodule
        if: matrix.data == 'lite'
        run: git -C cxx submodule foreach --recursive 'git lfs install --local && git lfs pull'

      - name: Choose the Lite data files
        if: matrix.data == 'lite'
        run: |
          dd="${GITHUB_WORKSPACE}/cxx/device-detection-data/51Degrees-LiteV4.1.hash"
          ipi="${GITHUB_WORKSPACE}/cxx/ip-intelligence-data/51Degrees-IPIV4AsnIpiV41.ipi"
          for file in "$dd" "$ipi"; do
            if [ ! -f "$file" ] || head -c 64 "$file" | grep -q 'git-lfs'; then
              echo "::error::$file is missing or is a Git LFS pointer"
              exit 1
            fi
          done
          echo "DD_FILE=$dd" >> "$GITHUB_ENV"
          echo "IPI_FILE=$ipi" >> "$GITHUB_ENV"
          echo "RUN=true" >> "$GITHUB_ENV"

      - name: Check the license keys are available
        if: matrix.data == 'enterprise'
        env:
          DEVICE_DETECTION_KEY: ${{ secrets.DEVICE_DETECTION_KEY }}
          IP_INTELLIGENCE_KEY: ${{ secrets.IP_INTELLIGENCE_KEY }}
        run: |
          if [ -n "$DEVICE_DETECTION_KEY" ] && [ -n "$IP_INTELLIGENCE_KEY" ]; then
            echo "RUN=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=No license keys::DEVICE_DETECTION_KEY and IP_INTELLIGENCE_KEY are not both available, so the Enterprise comparison is skipped."
            echo "RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Fetch the Enterprise data files
        if: matrix.data == 'enterprise' && env.RUN == 'true'
        uses: 51Degrees/common-ci/actions/fetch-assets@main
        with:
          assets: |
            TAC-HashV41.hash
            51Degrees-EnterpriseIpiV41.ipi
          cache: true
          device-detection-key: ${{ secrets.DEVICE_DETECTION_KEY }}
          device-detection-url: ${{ secrets.DEVICE_DETECTION_URL }}
          ip-intelligence-key: ${{ secrets.IP_INTELLIGENCE_KEY }}
          ip-intelligence-url: ${{ secrets.IPI_DATA_FILE_URL }}

      - name: Choose the Enterprise data files
        if: matrix.data == 'enterprise' && env.RUN == 'true'
        run: |
          echo "DD_FILE=${GITHUB_WORKSPACE}/assets/TAC-HashV41.hash" >> "$GITHUB_ENV"
          echo "IPI_FILE=${GITHUB_WORKSPACE}/assets/51Degrees-EnterpriseIpiV41.ipi" >> "$GITHUB_ENV"

      - name: Install .NET SDK
        if: env.RUN == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Rust toolchain
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: parity

      # The JavaScript builder depends on the 51Did crates, which compile in
      # the OWID source.
      - name: Copy the OWID source into fodid
        if: env.RUN == 'true'
        shell: pwsh
        run: ./ci/copy-owid-source.ps1

      - name: Check the parity workspace
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test -p parity-compare

      - name: Build
        if: env.RUN == 'true'
        working-directory: parity
        run: |
          cargo build -p parity-rust -p parity-compare
          dotnet build dotnet -c Release -o out/dotnet

      # Both sides must build the same C code (parity/README.md, "The C
      # code"). Each engine package records the 51degrees-dotnet commit it
      # was built from, and that commit's cxx submodule must be the one this
      # repository records.
      - name: Check both sides build the same C code
        if: env.RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ours=$(git rev-parse HEAD:cxx)
          assets=parity/dotnet/obj/project.assets.json
          packages=$(jq -r '.packageFolders | keys_unsorted[0]' "$assets")
          for id in FiftyOne.DeviceDetection.Hash.Engine.OnPremise FiftyOne.IpIntelligence.Engine.OnPremise; do
            path=$(jq -r --arg id "$id/" \
              '.libraries | to_entries[] | select(.key | startswith($id)) | .value.path' "$assets")
            repository=$(grep -o '<repository [^>]*>' "$packages/$path/${id,,}.nuspec")
            url=$(sed -n 's/.* url="\([^"]*\)".*/\1/p' <<< "$repository")
            commit=$(sed -n 's/.* commit="\([0-9a-f]*\)".*/\1/p' <<< "$repository")
            theirs=$(gh api "repos/${url#https://github.com/}/git/trees/$commit" \
              --jq '.tree[] | select(.path == "cxx" and .type == "commit") | .sha')
            echo "$id ($path) was built from $url at $commit, whose cxx is ${theirs:-absent}"
            if [ "$theirs" != "$ours" ]; then
              echo "::error::$id was built from $url at $commit, whose cxx submodule is ${theirs:-absent}, but this repository's cxx is $ours. Move the package versions in parity/dotnet/Parity.csproj to the 51degrees-dotnet release built from $ours."
              exit 1
            fi
          done

      - name: Write the answers
        if: env.RUN == 'true'
        working-directory: parity
        run: |
          args=(--corpus corpus/evidence.json --dd "$DD_FILE" --ipi "$IPI_FILE")
          dotnet out/dotnet/Parity.dll "${args[@]}" --out out/dotnet.jsonl
          target/debug/parity-rust "${args[@]}" --out out/rust.jsonl

      - name: Compare
        if: env.RUN == 'true'
        working-directory: parity
        run: |
          set +e
          target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust.jsonl \
            --allowed allowed-differences.json --data ${{ matrix.data }} \
            --report out/report.md --strict > /dev/null
          status=$?
          set -e
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # A changed Rust answer must fail the comparison and be named in the
      # report, or the comparison proves nothing.
      - name: Check that a changed answer fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          jq -c 'if .id == "ua-iphone" then .properties.device.ismobile.value |= not else . end' \
            out/rust.jsonl > out/rust-changed.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-changed.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-changed.md > /dev/null; then
            echo "::error::The comparison passed with a changed Rust answer"
            exit 1
          fi
          grep -q 'ua-iphone.*properties.device.ismobile' out/report-changed.md

      # A lost Rust answer, true or false, must fail too, in the properties
      # and in the JSON. The entries for a number or true or false value that
      # does not parse still let a lost 0 or false through, for the screen
      # sizes over the Lite files and for many properties over the Enterprise
      # files, until #224 removes that difference.
      - name: Check that a lost answer fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          jq -c 'if .id == "ua-iphone" or .id == "ua-chrome-windows" then
              (.properties.device.ismobile |= {name: .name, noValue: "No value for property IsMobile."})
              | (.json |= (fromjson | del(.device.ismobile) | tojson))
            else . end' out/rust.jsonl > out/rust-lost.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-lost.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-lost.md > /dev/null; then
            echo "::error::The comparison passed with a lost Rust answer"
            exit 1
          fi
          grep -q 'ua-iphone.*properties.device.ismobile' out/report-lost.md
          grep -q 'ua-iphone.*json.device.ismobile' out/report-lost.md
          grep -q 'ua-chrome-windows.*properties.device.ismobile' out/report-lost.md
          grep -q 'ua-chrome-windows.*json.device.ismobile' out/report-lost.md

      # The values cases compare the JSON byte for byte, so a Rust text with
      # the same structure and one escape written differently must fail too.
      - name: Check that a changed JSON text fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          jq -c 'if .id == "json-values-sequence-8" then .json |= sub("\\\\u2028"; "\u2028") else . end' \
            out/rust.jsonl > out/rust-text.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-text.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-text.md > /dev/null; then
            echo "::error::The comparison passed with a changed JSON text"
            exit 1
          fi
          grep -q '`json-values-sequence-8`.* at `json`: ' out/report-text.md

      # The values-promise- cases give Promise Full, then no value, then Full
      # again, so each side's script must turn promises on, off and on.
      - name: Check promises are decided for each request
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          want='values-promise-full=true values-promise-none=false values-promise-full-again=true'
          for side in dotnet rust; do
            got=$(jq -r 'select(.id | startswith("values-promise-"))
              | "\(.id)=\(.javascript | contains("new Promise("))"' "out/$side.jsonl" | paste -sd ' ')
            echo "$side: $got"
            if [ "$got" != "$want" ]; then
              echo "::error::The $side script did not turn promises on, off and on"
              exit 1
            fi
          done

      # The values cases compare the JavaScript byte for byte apart from
      # .NET's CRLF line endings, so a Rust script with promises left off, or
      # with CRLF line endings of its own, must fail.
      - name: Check that a changed JavaScript text fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          jq -c 'if .id == "values-promise-full-again" then .javascript |= sub("new Promise"; "Promise")
            elif .id == "values-promise-none" then .javascript |= gsub("\n"; "\r\n")
            else . end' out/rust.jsonl > out/rust-script.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-script.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-script.md > /dev/null; then
            echo "::error::The comparison passed with a changed JavaScript text"
            exit 1
          fi
          grep -q '^- `javascript` text, ' out/report-script.md
          grep -q '`values-promise-full-again`.* at `javascript`: ' out/report-script.md
          grep -q '^- `javascript` lineEndings, ' out/report-script.md
          grep -q '`values-promise-none`.* at `javascript`: ' out/report-script.md

      - name: Upload the answers and the report
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: comparison-${{ matrix.data }}
          path: |
            parity/out/*.jsonl
            parity/out/*.md
          if-no-files-found: ignore
