name: Comparison with .NET

# Runs the crates and the .NET packages over the corpus in parity/ and fails
# on any difference that parity/allowed-differences.json does not list with
# its reason. parity/README.md describes the programs and the line format.
#
# The lite job uses the free data files that the data repository inside cxx,
# at cxx/data, links, restored as pull-request.yml restores them. The
# enterprise job uses the Enterprise files, fetched with the license keys
# when they are available to the run, and is skipped with a warning when
# they are not.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: dotnet-comparison-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  compare:
    name: compare (${{ matrix.data }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        data: [lite, enterprise]
    defaults:
      run:
        shell: bash
    env:
      # The Lite files the lite job compares on, one per line. The download
      # and the check below both take this list, so they cannot drift apart.
      DATA_FILES: |
        cxx/data/device-detection/51Degrees-LiteV4.1.hash
        cxx/data/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi
    steps:
      # The cxx submodule brings the data repository with it at cxx/data.
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The data repository holds a link for each data file rather than the
      # file, and its own script downloads them. As in pull-request.yml, the
      # files come from the entry the Data Files workflow saves in the Actions
      # cache each day, and the script downloads only a file that was not
      # restored. A file that is missing fails the job at the next step.
      - name: Restore the Lite data files
        id: data
        if: matrix.data == 'lite'
        uses: ./.github/actions/restore-data-files

      - name: Download any Lite data file not restored
        if: matrix.data == 'lite'
        continue-on-error: true
        shell: pwsh
        run: |
          $names = $env:DATA_FILES.Trim() -split '\r?\n' |
            ForEach-Object { Split-Path -Leaf $_.Trim() }
          ./cxx/data/get-data-files.ps1 @names

      - name: Choose the Lite data files
        if: matrix.data == 'lite'
        run: |
          while IFS= read -r file; do
            if [ -n "$file" ] && [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              exit 1
            fi
          done <<< "$DATA_FILES"
          echo "DD_FILE=${GITHUB_WORKSPACE}/cxx/data/device-detection/51Degrees-LiteV4.1.hash" >> "$GITHUB_ENV"
          echo "IPI_FILE=${GITHUB_WORKSPACE}/cxx/data/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi" >> "$GITHUB_ENV"
          echo "RUN=true" >> "$GITHUB_ENV"

      # As in pull-request.yml, only when nothing was restored, and with the
      # action's paths, because an entry is found only by the list it was
      # saved with.
      - name: Save the Lite data files for later runs today
        if: matrix.data == 'lite' && steps.data.outputs.save-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.data.outputs.paths }}
          key: ${{ steps.data.outputs.save-key }}
          enableCrossOsArchive: true

      - name: Check the license keys are available
        if: matrix.data == 'enterprise'
        env:
          DEVICE_DETECTION_KEY: ${{ secrets.DEVICE_DETECTION_KEY }}
          IP_INTELLIGENCE_KEY: ${{ secrets.IP_INTELLIGENCE_KEY }}
        run: |
          if [ -n "$DEVICE_DETECTION_KEY" ] && [ -n "$IP_INTELLIGENCE_KEY" ]; then
            echo "RUN=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=No license keys::DEVICE_DETECTION_KEY and IP_INTELLIGENCE_KEY are not both available, so the Enterprise comparison is skipped."
            echo "RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Fetch the Enterprise data files
        if: matrix.data == 'enterprise' && env.RUN == 'true'
        uses: 51Degrees/common-ci/actions/fetch-assets@main
        with:
          assets: |
            TAC-HashV41.hash
            51Degrees-EnterpriseIpiV41.ipi
          cache: true
          device-detection-key: ${{ secrets.DEVICE_DETECTION_KEY }}
          device-detection-url: ${{ secrets.DEVICE_DETECTION_URL }}
          ip-intelligence-key: ${{ secrets.IP_INTELLIGENCE_KEY }}
          ip-intelligence-url: ${{ secrets.IPI_DATA_FILE_URL }}

      - name: Choose the Enterprise data files
        if: matrix.data == 'enterprise' && env.RUN == 'true'
        run: |
          echo "DD_FILE=${GITHUB_WORKSPACE}/assets/TAC-HashV41.hash" >> "$GITHUB_ENV"
          echo "IPI_FILE=${GITHUB_WORKSPACE}/assets/51Degrees-EnterpriseIpiV41.ipi" >> "$GITHUB_ENV"

      - name: Install .NET SDK
        if: env.RUN == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Rust toolchain
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: parity

      # The producer depends on the 51Did crates, which compile in the OWID
      # source.
      - name: Copy the OWID source into fodid
        if: env.RUN == 'true'
        shell: pwsh
        run: ./ci/copy-owid-source.ps1

      - name: Check the parity workspace
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test -p parity-compare

      # The parity workspace resolves its own lock. The comparison proves
      # .NET's order for the collation data that lock holds, so it must be
      # the data the library's lock, and so the crate's tests, use.
      - name: Check both locks hold the same collation data
        if: matrix.data == 'lite'
        run: |
          for crate in icu_collator icu_collator_data; do
            library=$(grep -A1 "^name = \"$crate\"$" Cargo.lock |
              sed -n 's/^version = "\(.*\)"$/\1/p')
            parity=$(grep -A1 "^name = \"$crate\"$" parity/Cargo.lock |
              sed -n 's/^version = "\(.*\)"$/\1/p')
            echo "$crate: $library in Cargo.lock, $parity in parity/Cargo.lock"
            if [ -z "$library" ] || [ "$library" != "$parity" ]; then
              echo "::error::$crate differs between the two locks"
              exit 1
            fi
          done

      - name: Build
        if: env.RUN == 'true'
        working-directory: parity
        run: |
          cargo build -p parity-rust -p parity-compare
          dotnet build dotnet -c Release -o out/dotnet

      # Both sides must build the same C code (parity/README.md, "The C
      # code"). Each engine package records the 51degrees-dotnet commit it
      # was built from, and that commit's cxx submodule must be the one this
      # repository records.
      - name: Check both sides build the same C code
        if: env.RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ours=$(git rev-parse HEAD:cxx)
          assets=parity/dotnet/obj/project.assets.json
          packages=$(jq -r '.packageFolders | keys_unsorted[0]' "$assets")
          for id in FiftyOne.DeviceDetection.Hash.Engine.OnPremise FiftyOne.IpIntelligence.Engine.OnPremise; do
            path=$(jq -r --arg id "$id/" \
              '.libraries | to_entries[] | select(.key | startswith($id)) | .value.path' "$assets")
            repository=$(grep -o '<repository [^>]*>' "$packages/$path/${id,,}.nuspec")
            url=$(sed -n 's/.* url="\([^"]*\)".*/\1/p' <<< "$repository")
            commit=$(sed -n 's/.* commit="\([0-9a-f]*\)".*/\1/p' <<< "$repository")
            theirs=$(gh api "repos/${url#https://github.com/}/git/trees/$commit" \
              --jq '.tree[] | select(.path == "cxx" and .type == "commit") | .sha')
            echo "$id ($path) was built from $url at $commit, whose cxx is ${theirs:-absent}"
            if [ "$theirs" != "$ours" ]; then
              echo "::error::$id was built from $url at $commit, whose cxx submodule is ${theirs:-absent}, but this repository's cxx is $ours. Move the package versions in parity/dotnet/Parity.csproj to the 51degrees-dotnet release built from $ours."
              exit 1
            fi
          done

      - name: Write the answers
        if: env.RUN == 'true'
        working-directory: parity
        run: |
          args=(--corpus corpus/evidence.json --dd "$DD_FILE" --ipi "$IPI_FILE")
          dotnet out/dotnet/Parity.dll "${args[@]}" --out out/dotnet.jsonl
          target/debug/parity-rust "${args[@]}" --out out/rust.jsonl
          # Each side signs the 51Did cases with a key made for the run, then
          # each reads both signed lists, so each verifies the other's
          # signatures.
          target/debug/parity-rust fodid-sign --cases corpus/fodid.json \
            --prefix rust- --out out/fodid-rust.json
          dotnet out/dotnet/Parity.dll fodid-sign --cases corpus/fodid.json \
            --prefix dotnet- --out out/fodid-dotnet.json
          signed=(--corpus out/fodid-rust.json --corpus out/fodid-dotnet.json)
          target/debug/parity-rust fodid "${signed[@]}" --out out/fodid-rust.jsonl
          dotnet out/dotnet/Parity.dll fodid "${signed[@]}" --out out/fodid-dotnet.jsonl
          # Each side builds the pipeline each configuration case describes
          # and writes what it built, or the error.
          config=(--cases corpus/configuration.json --dd "$DD_FILE" --ipi "$IPI_FILE")
          dotnet out/dotnet/Parity.dll configuration "${config[@]}" \
            --out out/configuration-dotnet.jsonl
          target/debug/parity-rust configuration "${config[@]}" \
            --out out/configuration-rust.jsonl

      - name: Compare
        if: env.RUN == 'true'
        working-directory: parity
        run: |
          set +e
          target/debug/parity-compare --corpus corpus/evidence.json \
            --corpus out/fodid-rust.json --corpus out/fodid-dotnet.json \
            --corpus corpus/configuration.json \
            --dotnet out/dotnet.jsonl --dotnet out/fodid-dotnet.jsonl \
            --dotnet out/configuration-dotnet.jsonl \
            --rust out/rust.jsonl --rust out/fodid-rust.jsonl \
            --rust out/configuration-rust.jsonl \
            --allowed allowed-differences.json --data ${{ matrix.data }} \
            --report out/report.md --strict > /dev/null
          status=$?
          set -e
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Latitude, Longitude and the points of Areas are given to 3 decimal
      # places. Only the Enterprise file carries them, so the test runs here,
      # and 51DEGREES_REQUIRE_LOCATION makes it fail rather than skip if the
      # file stops carrying them or does not reach the test.
      - name: Check locations have 3 decimal places
        if: ${{ !cancelled() && matrix.data == 'enterprise' && env.RUN == 'true' }}
        run: |
          env 51DEGREES_IPI_PATH="$IPI_FILE" 51DEGREES_REQUIRE_LOCATION=1 \
            cargo test -p fiftyone-ip-intelligence-onpremise \
            --test decimal_places -- --nocapture

      # A changed Rust answer must fail the comparison and be named in the
      # report, or the comparison proves nothing.
      - name: Check that a changed answer fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          jq -c 'if .id == "ua-iphone" then .properties.device.ismobile.value |= not else . end' \
            out/rust.jsonl > out/rust-changed.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-changed.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-changed.md > /dev/null; then
            echo "::error::The comparison passed with a changed Rust answer"
            exit 1
          fi
          grep -q 'ua-iphone.*properties.device.ismobile' out/report-changed.md

      # A lost Rust answer, true or false, must fail too, in the properties
      # and in the JSON. The entries for a number or true or false value that
      # does not parse still let a lost 0 or false through, for the screen
      # sizes over the Lite files and for many properties over the Enterprise
      # files, until #224 removes that difference.
      - name: Check that a lost answer fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          jq -c 'if .id == "ua-iphone" or .id == "ua-chrome-windows" then
              (.properties.device.ismobile |= {name: .name, noValue: "No value for property IsMobile."})
              | (.json |= (fromjson | del(.device.ismobile) | tojson))
            else . end' out/rust.jsonl > out/rust-lost.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-lost.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-lost.md > /dev/null; then
            echo "::error::The comparison passed with a lost Rust answer"
            exit 1
          fi
          grep -q 'ua-iphone.*properties.device.ismobile' out/report-lost.md
          grep -q 'ua-iphone.*json.device.ismobile' out/report-lost.md
          grep -q 'ua-chrome-windows.*properties.device.ismobile' out/report-lost.md
          grep -q 'ua-chrome-windows.*json.device.ismobile' out/report-lost.md

      # The values cases compare the JSON byte for byte, so a Rust text with
      # the same structure and one escape written differently must fail too.
      - name: Check that a changed JSON text fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          jq -c 'if .id == "json-values-sequence-8" then .json |= sub("\\\\u2028"; "\u2028") else . end' \
            out/rust.jsonl > out/rust-text.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-text.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-text.md > /dev/null; then
            echo "::error::The comparison passed with a changed JSON text"
            exit 1
          fi
          grep -q '`json-values-sequence-8`.* at `json`: ' out/report-text.md

      # The values-promise- cases give Promise Full, then no value, then Full
      # again, so each side's script must turn promises on, off and on.
      - name: Check promises are decided for each request
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          want='values-promise-full=true values-promise-none=false values-promise-full-again=true'
          for side in dotnet rust; do
            got=$(jq -r 'select(.id | startswith("values-promise-"))
              | "\(.id)=\(.javascript | contains("new Promise("))"' "out/$side.jsonl" | paste -sd ' ')
            echo "$side: $got"
            if [ "$got" != "$want" ]; then
              echo "::error::The $side script did not turn promises on, off and on"
              exit 1
            fi
          done

      # The values cases compare the JavaScript byte for byte apart from
      # .NET's CRLF line endings, so a Rust script with promises left off, or
      # with CRLF line endings of its own, must fail.
      - name: Check that a changed JavaScript text fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          jq -c 'if .id == "values-promise-full-again" then .javascript |= sub("new Promise"; "Promise")
            elif .id == "values-promise-none" then .javascript |= gsub("\n"; "\r\n")
            else . end' out/rust.jsonl > out/rust-script.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-script.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-script.md > /dev/null; then
            echo "::error::The comparison passed with a changed JavaScript text"
            exit 1
          fi
          grep -q '^- `javascript` text, ' out/report-script.md
          grep -q '`values-promise-full-again`.* at `javascript`: ' out/report-script.md
          grep -q '^- `javascript` lineEndings, ' out/report-script.md
          grep -q '`values-promise-none`.* at `javascript`: ' out/report-script.md

      # Both usage sharing elements must write a record for every case of the
      # engines' pipeline apart from the one whose evidence they ignore, on
      # both sides, or comparing the records proves nothing.
      - name: Check every usage record is written
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          want=$(jq -r '.[] | select(.pipeline == null and .id != "usage-health-check") | .id' \
            corpus/evidence.json | LC_ALL=C sort | paste -sd ' ')
          for side in dotnet rust; do
            for field in usage usageCustom; do
              got=$(jq -r --arg field "$field" 'select(.[$field] != null) | .id' "out/$side.jsonl" \
                | LC_ALL=C sort | paste -sd ' ')
              if [ "$got" != "$want" ]; then
                echo "::error::The $side $field records are for: $got"
                exit 1
              fi
            done
          done
          echo "Both sides wrote both records for: $want"

      # The records are compared as text, so a Rust record with one evidence
      # value changed, or with one of the second element's Flow Element names
      # changed, must fail.
      - name: Check that a changed usage record fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          jq -c 'if .id == "usage-evidence" then .usage |= sub("en-GB"; "en-US")
            elif .id == "ua-iphone" then .usageCustom |= sub("Custom element 2"; "Custom element 3")
            else . end' out/rust.jsonl > out/rust-usage.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-usage.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-usage.md > /dev/null; then
            echo "::error::The comparison passed with a changed usage record"
            exit 1
          fi
          grep -q '`usage-evidence`.* at `usage`: ' out/report-usage.md
          grep -q '`ua-iphone`.* at `usageCustom`: ' out/report-usage.md

      # The configuration cases that build must build on both sides, and the
      # others fail, so none can agree by both failing. Then a Rust line with
      # a setting read back differently, with two elements in the other
      # order, or with the other answer for the suppress setting, must fail.
      - name: Check that a changed configuration answer fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          want='configuration-pipeline configuration-no-group'
          want+=' configuration-setting-in-both-sections'
          want+=' configuration-setting-forms-in-both-sections'
          want+=' configuration-setting-case-in-both-sections'
          for side in dotnet rust; do
            got=$(jq -r 'select(.configuration.error == null) | .id' \
              "out/configuration-$side.jsonl" | paste -sd ' ')
            if [ "$got" != "$want" ]; then
              echo "::error::The $side configuration cases that built are: $got"
              exit 1
            fi
          done
          jq -c 'if .id == "configuration-pipeline" then
              .configuration.elements[2].settings.sharePercentage = 1
            elif .id == "configuration-no-group" then
              .configuration.elements |= [.[0], .[2], .[1]] + .[3:]
            elif .id == "configuration-setting-forms-in-both-sections" then
              .configuration.suppressProcessExceptions = true
            else . end' out/configuration-rust.jsonl > out/configuration-rust-changed.jsonl
          if target/debug/parity-compare --corpus corpus/configuration.json \
            --dotnet out/configuration-dotnet.jsonl \
            --rust out/configuration-rust-changed.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-configuration.md > /dev/null; then
            echo "::error::The comparison passed with a changed configuration answer"
            exit 1
          fi
          grep -q '`configuration-pipeline`.* at `configuration.elements\[2\].settings.sharePercentage`: ' \
            out/report-configuration.md
          grep -q '`configuration-no-group`.* at `configuration.elements\[1\].dataKey`: ' \
            out/report-configuration.md
          grep -q '`configuration-setting-forms-in-both-sections`.* at `configuration.suppressProcessExceptions`: ' \
            out/report-configuration.md

      # The translation cases must translate and sort on both sides, or the
      # two could agree by both failing. French must give the United
      # Kingdom's French name first and list all 250 countries sorted for
      # fr-FR. Then a Rust line with two countries of a sorted list swapped
      # must fail.
      - name: Check the translation cases translate and sort
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          want='Royaume-Uni fr-FR 250'
          for side in dotnet rust; do
            got=$(jq -r 'select(.id == "translation-header-fr")
              | .properties.countrynamestranslated
              | "\(.countrynamesgeographicaltranslated.value[0].value) \(.sortingcultureused.value) \(.countrynamesgeographicalalltranslated.value | length)"' \
              "out/$side.jsonl")
            echo "$side: $got"
            if [ "$got" != "$want" ]; then
              echo "::error::The $side translation case gave $got, not $want"
              exit 1
            fi
          done
          jq -c 'if .id == "translation-header-ja-jp" then
              .properties.countrynamestranslated.countrynamesgeographicalalltranslated.value
                |= (.[0:2] + [.[3], .[2]] + .[4:])
            else . end' out/rust.jsonl > out/rust-sorted.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-sorted.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-sorted.md > /dev/null; then
            echo "::error::The comparison passed with a changed sort"
            exit 1
          fi
          grep -q 'translation-header-ja-jp.*properties.countrynamestranslated.countrynamesgeographicalalltranslated' \
            out/report-sorted.md

      # The cloud translation cases must read the stand-in cloud's response
      # on both sides, or the two could agree by both failing. The full case
      # must give France's German name second with its raw weighting, the
      # culture the response gives and the three names of its list of every
      # country. The reasons a property is missing must be the same apart
      # from the link's tags. Then a Rust line with a changed raw
      # weighting must fail.
      - name: Check the cloud translation cases read the response
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          want='Frankreich 30000 de-DE 3'
          for side in dotnet rust; do
            got=$(jq -r 'select(.id == "cloud-translation-full")
              | .properties.countrynamestranslated
              | "\(.countrynamesgeographicaltranslated.value[1].value) \(.countrynamesgeographicaltranslated.value[1].rawWeighting) \(.sortingcultureused.value) \(.countrynamesgeographicalalltranslated.value | length)"' \
              "out/$side.jsonl")
            echo "$side: $got"
            if [ "$got" != "$want" ]; then
              echo "::error::The $side cloud translation case gave $got, not $want"
              exit 1
            fi
          done
          # A property the response does not give is missing on both sides,
          # and the two reasons must be the same once the configurator
          # link's campaign tags are removed. The empty section has seven.
          for side in dotnet rust; do
            jq -c 'select(.id | startswith("cloud-translation-"))
              | [.id, ((.properties.countrynamestranslated // {}) | to_entries
                | map(select(.value.missing != null)
                  | [.key, (.value.missing | sub("[?]utm_[^ ]*"; ""))])
                | sort)]' "out/$side.jsonl" > "out/cloud-missing-$side.jsonl"
          done
          if ! diff out/cloud-missing-dotnet.jsonl out/cloud-missing-rust.jsonl; then
            echo "::error::The reasons for a missing cloud translation property differ by more than the link's tags"
            exit 1
          fi
          count=$(jq -r 'select(.[0] == "cloud-translation-section-empty") | .[1] | length' \
            out/cloud-missing-rust.jsonl)
          if [ "$count" != 7 ]; then
            echo "::error::The empty section case has $count missing properties, not 7"
            exit 1
          fi
          jq -c 'if .id == "cloud-translation-any-case" then
              .properties.countrynamestranslated.countrynamesgeographicaltranslated.value[0].rawWeighting = 30001
            else . end' out/rust.jsonl > out/rust-cloud.jsonl
          if target/debug/parity-compare --corpus corpus/evidence.json \
            --dotnet out/dotnet.jsonl --rust out/rust-cloud.jsonl \
            --allowed allowed-differences.json --data lite \
            --report out/report-cloud.md > /dev/null; then
            echo "::error::The comparison passed with a changed raw weighting"
            exit 1
          fi
          grep -q 'cloud-translation-any-case.*properties.countrynamestranslated.countrynamesgeographicaltranslated' \
            out/report-cloud.md

      # Each side must read the signed 51Dids of both lists and verify each
      # signature, or the two could agree by both failing. Of the 31 signed
      # cases, 19 are meant to read and verify in .NET and 18 in the crates.
      # The rest are the tampered case, nine whose payload a reader refuses
      # and two with bytes after the envelope. The crates also refuse
      # encoding-url-spaced, whose text has white space inside it, a
      # difference allowed-differences.json records. A new signed case that
      # reads changes the numbers.
      - name: Check every signed 51Did verifies
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          declare -A want=([dotnet]=19 [rust]=18)
          for side in dotnet rust; do
            for list in rust dotnet; do
              # One row per signed case, its id, whether it was tampered,
              # and the parse and signature status this side read.
              rows=$(jq -rn --slurpfile signed "out/fodid-$list.json" '
                (reduce inputs as $line ({}; .[$line.id] = $line.fodid)) as $read
                | $signed[0][] | select(.publicKey != null)
                | "\(.id) \(.tamper) \($read[.id].status) \($read[.id].signatureStatus)"' \
                "out/fodid-$side.jsonl")
              valid=$(awk '$2 == "false" && $3 == "Parsed" && $4 == "SignatureValid"' <<< "$rows" | wc -l)
              wrong=$(awk '($2 == "true" && $4 != "SignatureInvalid") ||
                ($2 == "false" && $3 == "Parsed" && $4 != "SignatureValid")' <<< "$rows" | paste -sd ',')
              echo "$side verified $valid of the $list list's signed 51Dids"
              if [ -n "$wrong" ]; then
                echo "::error::$side read these signed 51Dids of the $list list wrongly: $wrong"
                exit 1
              fi
              if [ "$valid" -ne "${want[$side]}" ]; then
                echo "::error::$side verified $valid of the $list list's signed 51Dids, not ${want[$side]}"
                exit 1
              fi
            done
          done

      # The 51Did lines are compared field by field, so a Rust line read from
      # the .NET list with a changed match key, and a Rust metadata line with
      # a changed description, must fail.
      - name: Check that a changed 51Did answer fails
        if: matrix.data == 'lite'
        working-directory: parity
        run: |
          jq -c 'if .id == "dotnet-probabilistic" then .fodid.matchKey = "00"
            elif .id == "rust-metadata" then .metadata.properties[0].description |= . + " Changed."
            else . end' out/fodid-rust.jsonl > out/fodid-rust-changed.jsonl
          if target/debug/parity-compare --corpus out/fodid-rust.json \
            --corpus out/fodid-dotnet.json --dotnet out/fodid-dotnet.jsonl \
            --rust out/fodid-rust-changed.jsonl --allowed allowed-differences.json \
            --data lite --report out/report-fodid-changed.md > /dev/null; then
            echo "::error::The comparison passed with a changed 51Did answer"
            exit 1
          fi
          grep -q '`dotnet-probabilistic`.* at `fodid\.matchKey`: ' out/report-fodid-changed.md
          grep -q '`rust-metadata`.* at `metadata\.properties\[0\]\.description`: ' \
            out/report-fodid-changed.md

      - name: Upload the answers and the report
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: comparison-${{ matrix.data }}
          path: |
            parity/out/*.json
            parity/out/*.jsonl
            parity/out/*.md
          if-no-files-found: ignore
