name: Publish

# Publish the 51Degrees crates that changed to crates.io when main changes,
# each at its own version. A crate is released when a file that counts
# changed since its last tag '<crate>/<version>', under its folder or a path
# ci/packages.json names in its ExtraPaths (the workspace Cargo.toml, and a
# submodule it is built from with the script that copies it in), and with it
# every crate that depends on it. common-ci's ignore list and
# ci/release-plan-filter.ps1 decide which files count, once the common-ci
# branch this reads calls them. Only the patch number moves, and every other
# crate keeps the version it last released. The rules are common-ci's
# steps/release-plan.ps1, read from ci/packages.json, and
# ci/get-release-plan.ps1 prints the plan.
#
# Authentication uses crates.io Trusted Publishing: the
# rust-lang/crates-io-auth-action exchanges this run's GitHub OIDC identity for a
# short-lived crates.io token, so no long-lived API token is stored in the
# repository. Each published crate must have this repository and workflow
# registered as a trusted publisher on crates.io (one-time setup, see
# ci/setup-trusted-publishing.sh and https://crates.io/docs/trusted-publishing).

on:
  push:
    branches: [main]
  # The only route that can allow a major or minor bump, so that releasing one
  # is a person dispatching this workflow with their name on the run rather
  # than something a commit message does quietly.
  workflow_dispatch:
    inputs:
      allow-version-bump:
        description: 'Publish even though a crate moves the major or minor place.'
        type: boolean
        default: false

# Never let two publish runs race; a second push waits for the first to finish.
concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      # write, because a successful publish writes the tag each crate's next
      # release counts from and creates its GitHub release.
      contents: write
      # Required to mint the OIDC token Trusted Publishing exchanges for a
      # short-lived crates.io token.
      id-token: write
    outputs:
      released: ${{ steps.plan.outputs.count }}
    steps:
      # The owid-rust submodule holds the OWID source that ci/copy-owid-source.ps1
      # compiles into fodid, and the cxx submodule holds the C sources that
      # ci/copy-cxx-sources.ps1 copies into the -sys crates. Each copy is
      # ignored by git and listed in its crate manifest's include, so cargo
      # publish packages it with the crate. The data submodules inside cxx are
      # not needed to publish, so the checkout is not recursive.
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The plan reads each crate's tags, and a shallow clone has none.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # The release plan and the bump check below are taken from common-ci,
      # which the other languages publish through, so there is one rule and
      # not several that drift apart.
      - name: Checkout common-ci
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/common-ci
          path: common-ci
      # The plan is worked out once, before anything is tagged, and every
      # step after reads it from the file, because the tags this run makes
      # change what the plan would say. A crate with neither a tag of its own
      # nor a FirstVersion stops the run here, as there is nothing for its
      # version to count from.
      - name: Work out which crates to release
        id: plan
        shell: pwsh
        run: ./ci/get-release-plan.ps1 -OutFile "$env:RUNNER_TEMP/release-plan.json"
      # Refuses a crate whose version moves the major or minor place against
      # its own tags, or against its highest version on crates.io that is not
      # yanked (for a crate crates.io does not have, the major and minor the
      # others share), unless this run was dispatched by someone who asked
      # for it. A push to main carries no inputs, so that route can never
      # allow one. This runs before any version is written into the
      # manifests, so a refused run leaves the tree alone as well as
      # publishing nothing.
      - name: Refuse a major or minor bump nobody approved
        if: steps.plan.outputs.count != '0'
        shell: pwsh
        env:
          ALLOW_VERSION_BUMP: ${{ inputs.allow-version-bump }}
        run: >-
          ./ci/check-version-bump.ps1 -RepoName .
          -PlanFile "$env:RUNNER_TEMP/release-plan.json"
      # A crate the plan releases gets its next version, and every other crate
      # the version it last released, so each requirement between them names
      # a version that is on crates.io or is published in this run.
      - name: Write each crate's version
        if: steps.plan.outputs.count != '0'
        shell: pwsh
        run: ./ci/set-crate-versions.ps1 -PlanFile "$env:RUNNER_TEMP/release-plan.json"
      - name: Copy the OWID source into fodid
        if: steps.plan.outputs.count != '0'
        shell: pwsh
        run: ./ci/copy-owid-source.ps1
      - name: Copy the C sources into the -sys crates
        if: steps.plan.outputs.count != '0'
        shell: pwsh
        run: ./ci/copy-cxx-sources.ps1
      # The examples are built and tested against this tree's crates, as the
      # other languages test their examples against the package they are
      # about to publish. The script gives every crate a version above every
      # crate's last release, so each one replaces its published copy, and
      # puts the manifests back as the step above wrote them. A failure here
      # stops the release.
      - name: Test the examples against the crates being released
        if: steps.plan.outputs.count != '0'
        shell: pwsh
        run: ./ci/test-examples-against-source.ps1
      - name: Authenticate to crates.io (Trusted Publishing)
        if: steps.plan.outputs.count != '0'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Trusted publishing cannot create a crate. A planned crate crates.io
      # does not have stops the run after the crates before it are
      # published, and the log gives the commands that publish it by hand.
      # Running the job again then skips every version crates.io has.
      - name: Publish the planned crates in dependency order
        if: steps.plan.outputs.count != '0'
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: ./ci/publish-planned-crates.ps1 -PlanFile "$env:RUNNER_TEMP/release-plan.json"

      # Each crate's tag is what its next release counts from, and its GitHub
      # release is created from the tag with notes for that crate. This runs
      # even when the plan is empty, because a rerun after the tags were
      # pushed plans nothing, and still has to create any release a failed
      # run left undone.
      - name: Tag and release each crate published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./ci/tag-crate-releases.ps1 -RepoName .
          -PlanFile "$env:RUNNER_TEMP/release-plan.json"
          -Repository '${{ github.repository }}'

  # AFTER publish: prove the just-released packages work by building and testing
  # the examples against crates.io (no source.toml patch). The pre-publish check
  # against local source lives in examples.yml.
  verify-published:
    name: examples vs published crates
    needs: publish
    if: needs.publish.outputs.released != '0'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Give the crates.io index a moment to serve the just-published versions,
      # then resolve them and run the examples' tests against the real packages.
      - run: sleep 90
      - run: cargo update
      - run: cargo test
