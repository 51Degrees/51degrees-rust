name: Throwaway red run of the track session tests
on:
  push:
    branches: [tmp/rust-session-red]
jobs:
  red:
    name: track session tests against rc's code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Copy the OWID source into fodid
        shell: pwsh
        run: ./ci/copy-owid-source.ps1
      - name: The usage sharing element's tests
        if: always()
        run: cargo test -p fiftyone-pipeline-engines-fiftyone --lib share_usage_element
      - name: The configuration tests
        if: always()
        run: cargo test -p fiftyone-pipeline-engines-fiftyone --test configuration
