name: Cloud 51Did Tests

# Runs the two live cloud 51Did integration tests. Each test runs once for
# each resource key it is given below, read under the key's own name.
#
# The keys are named one by one rather than passed as toJSON(secrets).
# GitHub marks a workflow that hands every secret to a step as possibly
# malicious and holds each run until someone approves it by hand. The
# resource keys come from organization variables and the license key from an
# organization secret. A new resource key therefore needs a line here and in
# the tests as well as the organization variable.
#
# The two tests cover different halves. fodid/tests/cloud_51did.rs creates an
# identifier at each usage the key grants and checks it parses.
# fodid-client/tests/live_cloud.rs takes the server side further, verifying
# through the cloud and offline, sealing a creator context result and
# redeeming it with the license key to read the nine factors. The service
# only opens a sealed result for a license key of the account whose resource
# key sealed it, so the test pairs _51DEGREES_RESOURCE_KEY_51DID with
# _51DEGREES_LICENSE_KEY_51DID and runs the other keys with no license key. A
# pass with no license key still passes, asserting the refusal the cloud gives
# a caller who has none.
#
# Both tests carry #[ignore] so a plain `cargo test` leaves them alone, which
# is why the runs below pass --include-ignored. Each skips itself when no key
# is set, so a run with no keys is green and proves nothing. That is
# deliberate, because a pull request from a fork has no secrets, and it is the
# reason the step below reports which keys are set, by name.
#
# The fodid and fodid-client crates are pure Rust, taking the OWID library as
# copied source rather than through the -sys crates, so this needs none of the
# C/C++ checkouts the main build workflow sets up.

on:
  workflow_dispatch:
  # Nightly as well, because a pull_request run only ever checks the package
  # against the cloud as it stood that day. A released package is not checked
  # again, so a field the cloud starts writing, stops writing or changes goes
  # unnoticed until a customer finds it. That is what happened when the cloud service began
  # writing the Terms byte. The six 51Did packages are
  # staggered ten minutes apart so they do not all ask production at once.
  schedule:
    - cron: '50 5 * * *'
  pull_request:
    branches: [main, rc, 'release/**']
    paths:
      - 'fodid/**'
      - 'fodid-client/**'
      - 'owid-rust/**'
      - 'ci/copy-owid-source.ps1'
      - '.github/workflows/cloud-51did.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fodid compiles the owid-rust submodule source, copied in below.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Copy the OWID source into the crate
        shell: pwsh
        run: ./ci/copy-owid-source.ps1
      - name: Cloud 51Did tests with each resource key
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY_51DID: ${{ vars._51DEGREES_RESOURCE_KEY_51DID }}
          _51DEGREES_RESOURCE_KEY_BESPOKE: ${{ vars._51DEGREES_RESOURCE_KEY_BESPOKE }}
          _51DEGREES_RESOURCE_KEY_BASIC: ${{ vars._51DEGREES_RESOURCE_KEY_BASIC }}
          # The license key of the account _51DEGREES_RESOURCE_KEY_51DID
          # belongs to, which the client test redeems with on that pass.
          _51DEGREES_LICENSE_KEY_51DID: ${{ secrets._51DEGREES_LICENSE_KEY_51DID }}
          # The cloud service the tests ask, which is the public one when
          # the variable is not set.
          _51DEGREES_CLOUD_ENDPOINT: ${{ vars._51DEGREES_CLOUD_ENDPOINT }}
        run: |
          # An organization variable that is not set gives an empty value,
          # which the engine would take as the address, so it is removed.
          if (-not $env:_51DEGREES_CLOUD_ENDPOINT) {
            Remove-Item -Path 'Env:_51DEGREES_CLOUD_ENDPOINT' -ErrorAction SilentlyContinue
          }
          $names = '_51DEGREES_RESOURCE_KEY_51DID', '_51DEGREES_RESOURCE_KEY_BESPOKE',
            '_51DEGREES_RESOURCE_KEY_BASIC', '_51DEGREES_LICENSE_KEY_51DID'
          $set = @($names | Where-Object { [Environment]::GetEnvironmentVariable($_) })
          if ($set) {
            Write-Host "Keys set: $($set -join ', ')"
          } else {
            Write-Host '::warning title=No keys::No resource key is available, so the tests check nothing.'
          }
          $failed = $false
          cargo test -p fodid --test cloud_51did -- --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          cargo test -p fodid-client --test live_cloud -- --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
