name: Data Files

# Keeps the free data files that the tests, examples and performance run read
# in one Actions cache entry, which every other workflow restores through
# .github/actions/restore-data-files, so CI rarely asks the Distributor for
# them. The Distributor allows each file only a few downloads an hour from one
# address.
#
# Each day this restores the newest entry, asks the Distributor whether each
# file has changed, which downloads nothing when it has not, and saves the
# files as a new entry. An entry saved on the default branch can be restored
# by every branch and pull request, whilst one a pull request saves can only
# be restored by that pull request. So the other workflows save an entry of
# their own only while no daily entry exists, for later runs of the same
# workflow on the same ref that day. GitHub runs a schedule only from the
# default branch.
#
# The second job does the same for the Enterprise data files the comparison
# with .NET reads, which the shared fetch step keeps in an entry of its own.

on:
  schedule:
    # 00:30 UTC daily, before the nightly performance run.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh the data files
    runs-on: ubuntu-latest
    steps:
      # The cxx submodule brings the data repository and its script at
      # cxx/data.
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore the data files
        id: data
        uses: ./.github/actions/restore-data-files

      # -Update asks for each restored file only if it is newer than the copy
      # here, and the Distributor answers 304 with no file when it is not. A
      # file the entry does not hold is downloaded. A failed request leaves
      # the restored file in place, so the check below decides.
      - name: Refresh the data files
        continue-on-error: true
        shell: pwsh
        env:
          PATHS: ${{ steps.data.outputs.paths }}
        run: |
          $names = $env:PATHS.Trim() -split '\r?\n' |
            ForEach-Object { Split-Path -Leaf $_.Trim() }
          ./cxx/data/get-data-files.ps1 @names -Update

      - name: Check the data files
        shell: bash
        env:
          PATHS: ${{ steps.data.outputs.paths }}
        run: |
          while IFS= read -r file; do
            if [ -n "$file" ] && [ ! -f "$file" ]; then
              echo "::error::$file is missing, so no entry is saved"
              exit 1
            fi
          done <<< "$PATHS"

      - name: Save the data files
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.data.outputs.paths }}
          key: ${{ steps.data.outputs.key }}
          enableCrossOsArchive: true

  # The shared fetch step keeps the files in an entry named after the day
  # and its inputs, and saves the entry when it restored none. Saved here,
  # on the default branch, the day's entry is one every branch's comparison
  # restores, where a comparison on a branch otherwise downloads the IP
  # Intelligence file, about 3 GB, for itself. The inputs are those of the
  # fetch step in dotnet-comparison.yml, because they name the entry.
  enterprise:
    name: Fetch the Enterprise data files for the comparison
    runs-on: ubuntu-latest
    steps:
      - name: Check the license keys are available
        shell: bash
        env:
          DEVICE_DETECTION_KEY: ${{ secrets.DEVICE_DETECTION_KEY }}
          IP_INTELLIGENCE_KEY: ${{ secrets.IP_INTELLIGENCE_KEY }}
        run: |
          if [ -z "$DEVICE_DETECTION_KEY" ] || [ -z "$IP_INTELLIGENCE_KEY" ]; then
            echo "::error title=No license keys::DEVICE_DETECTION_KEY and IP_INTELLIGENCE_KEY are not both available, so no entry is saved."
            exit 1
          fi

      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Fetch the Enterprise data files
        uses: 51Degrees/common-ci/actions/fetch-assets@main
        with:
          assets: |
            TAC-HashV41.hash
            51Degrees-EnterpriseIpiV41.ipi
          cache: true
          device-detection-key: ${{ secrets.DEVICE_DETECTION_KEY }}
          device-detection-url: ${{ secrets.DEVICE_DETECTION_URL }}
          ip-intelligence-key: ${{ secrets.IP_INTELLIGENCE_KEY }}
          ip-intelligence-url: ${{ secrets.IPI_DATA_FILE_URL }}
