name: tmp conflict warning test
on:
  push:
    branches: ['tmp/rust-conflict-*']
jobs:
  test:
    name: logging (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p fiftyone-cloud-request-engine --test logging
