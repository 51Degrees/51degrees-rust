name: tmp usage sharing back-off tests
on:
  push:
    branches: ['tmp/rust-backoff-*']
jobs:
  test:
    name: back-off tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: element tests
        if: always()
        run: cargo test -p fiftyone-pipeline-engines-fiftyone --lib share_usage_element
      - name: logging tests
        if: always()
        run: cargo test -p fiftyone-pipeline-engines-fiftyone --test logging
      - name: configuration tests
        if: always()
        run: cargo test -p fiftyone-pipeline-engines-fiftyone --test configuration
