name: Nightly Performance

# Runs the on-premise performance examples against this checkout's crates. Each
# example writes its results JSON, the shared
# steps/publish-performance-results.ps1 validates it and puts it at
# results_<name>.json, and the shared steps/compare-performance.ps1 charts it on
# the documentation performance graphs. The Rust on-premise engines call the C
# libraries in the cxx submodule through FFI, so the figures track native
# performance.
#
# This mirrors the per-language performance steps in common-ci's nightly
# workflows. It is kept self-contained here (rather than calling the shared
# reusable workflow) until the repository joins the shared nightly orchestration
# on GitHub. The comparison step needs historic results from earlier runs, so it
# is best-effort and only produces graphs once a run history exists.

on:
  schedule:
    # 02:00 UTC daily.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      common-ci-ref:
        type: string
        description: "common-ci branch/tag/sha to use (default: main)"
        default: ''
      cxx-ref:
        type: string
        description: "51degrees-cxx branch/tag/sha to use (default: the commit the cxx submodule records)"
        default: ''

jobs:
  performance:
    runs-on: ubuntu-latest
    # The publish step commits the rendered graphs to the gh-images branch, which
    # needs write access to repository contents. The comparison step also lists
    # this repository's prior performance-result artifacts to chart the trend,
    # which needs actions:read (gh api .../actions/artifacts returns 403
    # otherwise). An explicit permissions block defaults everything else to none,
    # so both must be named.
    permissions:
      contents: write
      actions: read
    env:
      # The data files the performance examples read that this workflow
      # downloads, one per line. The cache steps and the check below all take
      # this list, so they cannot drift apart.
      DATA_FILES: |
        51degrees-rust/cxx/data/device-detection/51Degrees-LiteV4.1.hash
        51degrees-rust/cxx/data/device-detection/20000 User Agents.csv
    steps:
      # 1. The Rust workspace, checked out into a subdirectory named after the
      #    repository so the common-ci script's -RepoName convention matches the
      #    other languages.
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          path: 51degrees-rust
          submodules: recursive
          # The adapter versions the crates from the release tags.
          fetch-depth: 0

      # 2. common-ci, checked out for the shared steps that publish and compare
      #    the results (steps/publish-performance-results.ps1 and
      #    steps/compare-performance.ps1). The Rust performance adapter lives in
      #    this repo at ci/run-performance-tests.ps1 (see
      #    ci/missing-ci-scripts.md), because it serves only this repository.
      - name: Checkout common-ci
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/common-ci
          path: common-ci
          ref: ${{ inputs.common-ci-ref }}

      # 3. A cxx-ref given by hand moves the C sources, and the data repository
      #    they carry at cxx/data, to that branch, tag or commit.
      - name: Move the C sources to the cxx-ref given
        shell: bash
        env:
          CXX_REF: ${{ inputs.cxx-ref }}
        run: |
          if [ -n "$CXX_REF" ]; then
            git -C 51degrees-rust/cxx fetch origin "$CXX_REF"
            git -C 51degrees-rust/cxx checkout --detach FETCH_HEAD
            git -C 51degrees-rust/cxx submodule update --init --recursive
          fi

      # 4. The data repository holds a link for each data file rather than the
      #    file, and its own script downloads them. As in pull-request.yml, the
      #    Lite Hash file and the User-Agents the Device Detection example reads
      #    are kept in the Actions cache under the day's date, and a restored
      #    file is replaced only when the Distributor has a newer one.
      #    ci/run-performance-tests.ps1 downloads the ASN file itself, every
      #    run, so the figures are always for the latest file.
      - name: Date the data file cache
        id: data-date
        shell: bash
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the data files
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DATA_FILES }}
          key: data-files-nightly-performance-${{ steps.data-date.outputs.date }}
          restore-keys: data-files-nightly-performance-

      - name: Download the data files
        continue-on-error: true
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.data-cache.outputs.cache-hit }}
        run: |
          $names = $env:DATA_FILES.Trim() -split '\r?\n' |
            ForEach-Object { Split-Path -Leaf $_.Trim() }
          ./51degrees-rust/cxx/data/get-data-files.ps1 @names -Update:($env:CACHE_HIT -ne 'true')

      # 5. Point the examples at the Lite and ASN data files in the data
      #    repository. A Lite file or User-Agent file that is missing fails the
      #    job here.
      - name: Configure data files
        shell: bash
        run: |
          echo "51DEGREES_DD_PATH=${GITHUB_WORKSPACE}/51degrees-rust/cxx/data/device-detection/51Degrees-LiteV4.1.hash" >> "$GITHUB_ENV"
          echo "51DEGREES_IPI_PATH=${GITHUB_WORKSPACE}/51degrees-rust/cxx/data/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi" >> "$GITHUB_ENV"
          while IFS= read -r file; do
            if [ -n "$file" ] && [ ! -f "$file" ]; then
              echo "::error::$file is missing, so the performance examples cannot run"
              exit 1
            fi
          done <<< "$DATA_FILES"

      # The day's cache entry is written only once every file is there.
      - name: Save the data files
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DATA_FILES }}
          key: data-files-nightly-performance-${{ steps.data-date.outputs.date }}

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 51degrees-rust

      # 6. Run the performance examples against this checkout's crates and
      #    publish each results_<name>.json under
      #    51degrees-rust/test-results/performance-summary through the shared step.
      - name: Run performance and write results
        shell: pwsh
        run: ./51degrees-rust/ci/run-performance-tests.ps1 -RepoName 51degrees-rust

      - name: Upload Performance Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance_results-publish-rust
          path: 51degrees-rust/test-results/performance-summary/results_*.json

      # 7. Compare against historic figures and render the graphs, then publish
      #    them. `-Publish` makes the shared step render the PNG graphs and, on
      #    `main`, commit them to the `gh-images` branch (other branches use a
      #    `perf-images/<branch>` prefix). The documentation benchmarks page
      #    embeds those images by raw URL, so without `-Publish` the Rust graphs
      #    never appear. `-DryRun` still renders and commits the graphs locally
      #    (so the full render path is exercised) but suppresses the final
      #    `git push`, so a manually dispatched dry run leaves nothing outside
      #    this CI job. The `dryrun` input is empty on scheduled runs, which
      #    parse to `false`, so the nightly cron always publishes.
      #
      #    This step is allowed to fail the job. The shared
      #    compare-performance.ps1 exits 0 when it succeeds (including the benign
      #    "not enough history yet" case) and non-zero otherwise, whether that is
      #    a genuine performance regression or an infrastructure failure such as
      #    an inability to switch to the images branch. Neither should be
      #    silently swallowed, so `continue-on-error` is false.
      - name: Compare performance and render graphs
        continue-on-error: false
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The dryrun input is only set on manual dispatch; default it to
          # false so scheduled runs publish normally.
          $DryRun = [bool]::Parse( "${{ inputs.dryrun || 'false' }}" )
          # Committing the rendered graphs onto the gh-images branch needs a git
          # identity, which a bare runner checkout does not configure; use the
          # github-actions bot identity so the commit succeeds.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The comparison step reads the current results from the working
          # directory, so copy them up from the summary folder it was told to
          # write to.
          Copy-Item 51degrees-rust/test-results/performance-summary/results_*.json . -Force
          $options = @(
            @{ Name = "DeviceDetection-OnPremise"; RunPerformance = $true },
            @{ Name = "IpIntelligence-OnPremise";  RunPerformance = $true }
          )
          ./common-ci/steps/compare-performance.ps1 `
            -RepoName '51degrees-rust' `
            -OrgName '51Degrees' `
            -AllOptions $options `
            -Branch '${{ github.ref_name }}' `
            -DryRun $DryRun `
            -Publish

      # Runs even when the compare step failed. That upload is the only source
      # of future baselines, so skipping it on a failing compare would drop the
      # run's own figure out of history and wedge the trend (see below).
      - name: Escape Branch Name
        id: escape_branch
        if: always()
        shell: pwsh
        run: '"name=" + ($env:GITHUB_REF_NAME -replace ''[":<>|*?/\\\r\n]'', ''-'') | Out-File $env:GITHUB_OUTPUT -Append'

      # Runs even when the compare step failed (see above), but not on a dry
      # run: this artifact is the performance history, and a dry run must leave
      # nothing outside its own CI job, so it must not inject a figure here.
      - name: Upload Graphed Performance Results
        if: always() && github.event.inputs.dryrun != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publish_performance_results@${{ steps.escape_branch.outputs.name }}
          path: ${{ github.workspace }}/results_*.json
          if-no-files-found: ignore
          include-hidden-files: true
