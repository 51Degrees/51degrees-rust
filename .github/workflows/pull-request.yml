name: Pull Request

# Native build, test, lint, format and doc check for the Rust workspace, run on
# Windows, Linux and macOS (Intel and Apple Silicon). This is the primary gate
# for every pull request and every push to main. It replaces the earlier ci.yml.
#
# The workspace links the 51Degrees C sources through three -sys crates
# (common-sys, device-detection-sys, ip-intelligence-sys), whose build scripts
# compile them from the cxx submodule. The data repository inside cxx, at
# cxx/data, links the free on-premise data files, which the build job
# restores from the entry the Data Files workflow keeps in the Actions cache.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, rc, 'release/**']
  workflow_dispatch:

# A newer push to the same ref cancels an in-flight run so the queue stays short.
concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail the build on any compiler or rustdoc warning.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every platform to completion even if one fails, so a platform-specific
      # break is visible in the same run. OS versions follow our LTS policy: the
      # lowest LTS that supports our requirements, plus every greater LTS. Ubuntu
      # has a clear LTS cadence, so both current LTS releases are covered:
      # ubuntu-22.04 (the lowest LTS the toolchain supports; 20.04 runners are
      # retired) and ubuntu-24.04. Windows Server runners are all LTSC, so
      # windows-latest (Server 2022) is used. macOS has no LTS, so macos-latest
      # (Apple Silicon, arm64) is covered. The Intel runner macos-13 is omitted
      # for the moment because the hosted macos-13 queue has been unavailable and
      # leaves runs hanging; restore it here once capacity returns.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04, macos-latest]

    env:
      # The data files the tests read, one per line. The download and the
      # check below both take this list, so they cannot drift apart.
      DATA_FILES: |
        cxx/data/device-detection/51Degrees-LiteV4.1.hash
        cxx/data/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi

    steps:
      # 1. The Rust workspace with its submodules, recursively, so the cxx
      #    submodule brings the data repository with it at cxx/data.
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. The data repository holds a link for each data file rather than the
      #    file, and its own script downloads them. The Distributor refuses an
      #    address that downloads a file too often, so the files come from the
      #    entry the Data Files workflow saves in the Actions cache each day.
      #    The script keeps a restored file and downloads only one that was
      #    not restored. A failed download leaves the check in step 3 to
      #    decide. Until a daily entry exists, the files a job downloads are
      #    saved for later runs here that day, in the step after the check.
      - name: Restore the data files
        id: data
        uses: ./.github/actions/restore-data-files

      - name: Download any data file not restored
        continue-on-error: true
        shell: pwsh
        run: |
          $names = $env:DATA_FILES.Trim() -split '\r?\n' |
            ForEach-Object { Split-Path -Leaf $_.Trim() }
          ./cxx/data/get-data-files.ps1 @names

      # 3. Point the on-premise tests at the data files, which they otherwise
      #    look for in the workspace and skip when they do not find them.
      #    Setting these in GITHUB_ENV makes them available to every later step
      #    in this job. A data file that is missing fails the job here, because
      #    the tests would skip without it.
      - name: Configure data files
        shell: bash
        run: |
          echo "_51DEGREES_DD_PATH=${GITHUB_WORKSPACE}/cxx/data/device-detection/51Degrees-LiteV4.1.hash" >> "$GITHUB_ENV"
          echo "_51DEGREES_IPI_PATH=${GITHUB_WORKSPACE}/cxx/data/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi" >> "$GITHUB_ENV"
          while IFS= read -r file; do
            if [ -n "$file" ] && [ ! -f "$file" ]; then
              echo "::error::$file is missing, so the on-premise tests would skip"
              exit 1
            fi
          done <<< "$DATA_FILES"

      # Only when nothing was restored, and only once every file is there. The
      # paths are the action's, because an entry is found only by the list it
      # was saved with. Jobs that start together each download on a miss, and
      # the first to save keeps the entry.
      - name: Save the data files for later runs today
        if: steps.data.outputs.save-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.data.outputs.paths }}
          key: ${{ steps.data.outputs.save-key }}
          enableCrossOsArchive: true

      # 4. The native build toolchain. ubuntu-latest and windows-latest both ship
      #    a C/C++ compiler and CMake preinstalled, but install CMake explicitly so
      #    the workflow does not silently depend on the runner image keeping it.
      #    The cc crate finds the MSVC toolchain through vswhere on Windows, so no
      #    extra compiler setup is needed there.
      - name: Install CMake
        uses: lukka/get-cmake@latest

      # 5. The Rust toolchain with the components the lint and format steps need.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 6. Cache the registry, git deps and target dir keyed on the lockfile and OS
      #    so unchanged native objects and crate builds are reused between runs.
      #    The key is the specific matrix OS, not just runner.os. rust-cache
      #    otherwise keys Linux runners as "Linux" alone, so ubuntu-22.04 and
      #    ubuntu-24.04 would share a cache. They have different glibc versions
      #    (2.35 vs 2.39), and the cached native C objects are not interchangeable:
      #    objects compiled on 24.04 reference glibc 2.38+ symbols such as
      #    __isoc23_sscanf that do not exist on 22.04, so a shared cache breaks the
      #    link. A per-OS key keeps each version's compiled objects separate.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # 6a. The OWID source the fodid crate compiles in. ci/copy-owid-source.ps1
      #     copies it from the owid-rust submodule (checked out in step 1) into
      #     fodid/src/owid, which git ignores, so every build, test, lint and
      #     doc step below needs the copy in place first.
      - name: Copy the OWID source into fodid
        shell: pwsh
        run: ./ci/copy-owid-source.ps1

      # 7. The verification gate. fmt is checked first because it is the cheapest
      #    and most common failure. clippy and doc inherit RUSTFLAGS/RUSTDOCFLAGS
      #    so any warning fails the build.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build
        run: cargo build --workspace --all-targets

      # Device Detection and IP Intelligence each compile a copy of the common C
      # library. A common C library function the IP Intelligence renaming header
      # misses would be defined by both libraries and bound to one of them.
      - name: Check the two common C library copies share no symbol
        shell: pwsh
        run: ./ci/check-native-symbols.ps1

      - name: cargo test
        run: cargo test --workspace

      # Property name lookups must add up across threads. The test only tells
      # a shared lock apart from none in an optimised build, so it runs here
      # on its own and skips in the debug run above.
      - name: cargo test (property lookup scaling, release)
        run: cargo test --release -p fiftyone-native --test lookup_scaling -- --nocapture

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The fodid crate's cloud client sits behind its opt-in `cloud`
      # feature, which the workspace commands above leave off, so the crate
      # is tested and linted again here with every feature on.
      - name: cargo test (fodid, all features)
        run: cargo test -p fodid --all-features

      - name: cargo clippy (fodid, all features)
        run: cargo clippy -p fodid --all-targets --all-features -- -D warnings

      - name: cargo doc
        run: cargo doc --workspace --no-deps

      # 8. Live cloud tests. These are #[ignore]d so the steps above stay green
      #    offline; here they run with a real resource key when one is available.
      #    Each key is passed by name, so the step gets only the secrets it
      #    reads, and a new key needs a line here as well as the organization
      #    secret. The examples-shared resolver reads _51DEGREES_RESOURCE_KEY
      #    first, then the bespoke tiered key then the basic tiered key, and
      #    treats an empty value, which a secret that does not exist gives, as
      #    unset.
      - name: Cloud tests (with resource key when available)
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY_BESPOKE: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
          _51DEGREES_RESOURCE_KEY_BASIC: ${{ secrets._51DEGREES_RESOURCE_KEY_BASIC }}
        run: |
          # Resolve a single key in the examples-shared resolver order.
          $key = ${env:_51DEGREES_RESOURCE_KEY}
          if (-not $key) { $key = ${env:_51DEGREES_RESOURCE_KEY_BESPOKE} }
          if (-not $key) { $key = ${env:_51DEGREES_RESOURCE_KEY_BASIC} }
          if (-not $key) {
            Write-Host 'No resource key secret available; skipping live cloud tests.'
            exit 0
          }
          ${env:_51DEGREES_RESOURCE_KEY} = $key
          # Run ONLY the ignored tests across the workspace: the live cloud tests
          # that make real calls to the 51Degrees cloud, so a failure here is a
          # real regression. Deliberately --ignored, not --include-ignored: the
          # normal tests (including the memory-heavy native Hash detection tests)
          # already ran in the "cargo test" step above, and re-running them here
          # alongside the live cloud tests piled enough concurrent memory onto the
          # shared macOS runner to get the process OS-killed (SIGKILL). Running the
          # cloud tests alone keeps the coverage without the pileup.
          cargo test --workspace -- --ignored --nocapture
          # The cloud client's live tests need its opt-in feature.
          cargo test -p fodid --all-features -- --ignored --nocapture

  # The cloud crates must keep compiling for WebAssembly (wasm32-wasip1) so a
  # wasm consumer (for example a trusted-server deployment) can link them and
  # supply its own synchronous CloudHttpClient. The derived property element and
  # the IP Intelligence translation engines are covered too, because they
  # compile their scripts and translations in so that they can run where there
  # is no file system. They build with reqwest and the
  # data-update service disabled (default-features = false), so this job does
  # not compile the C/C++ sources the -sys crates compile, and it runs on Linux
  # alone because a cross-compile to wasm is host-neutral.
  #
  # Beyond compiling, the wasm-safe test suites are executed on the target under
  # wasmtime, so the pure-Rust logic is exercised on wasm rather than only built.
  # Two groups are deliberately not run here, for structural reasons rather than
  # convenience: the -sys / native / on-premise crates compile C and cannot
  # target wasm at all; and the live-cloud tests need outbound network and a real
  # resource key, which wasip1 sandboxes and which the reqwest-disabled build has
  # no transport for. fiftyone-caching's concurrency tests are also skipped, but
  # only those: they spawn threads and so live in a native-only test file, while
  # the crate's single-threaded behavioural suite does run here on wasm. The
  # derived property element's conformance cases and its script file tests,
  # and the check that every translation file of the data repository is
  # compiled in, read from disk, so they are native only as well.
  wasm:
    name: wasm (wasm32-wasip1)
    # Cross-compile to wasm is host-neutral; pin to a current LTS for consistency.
    runs-on: ubuntu-24.04
    steps:
      # The owid-rust submodule holds the OWID source that the fodid crate
      # compiles in, and the data repository inside cxx holds the translations
      # the IP Intelligence translation engines compile in, so the checkout is
      # recursive even though the C/C++ sources are not compiled here.
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # A separate cache key from the native build job, which compiles a
          # different target triple and feature set.
          key: wasm32-wasip1

      # fodid compiles the OWID source that ci/copy-owid-source.ps1 places under
      # fodid/src/owid (ignored by git), so the copy runs before any build.
      - name: Copy the OWID source into fodid
        shell: pwsh
        run: ./ci/copy-owid-source.ps1

      # Each crate is built standalone rather than in one cargo invocation so
      # feature unification across the set cannot pull reqwest in through a
      # sibling and hide a per-crate wasm break. --all-targets is deliberately
      # omitted: it would compile the test targets, which pull the tiny_http
      # dev-dependency that does not build for wasm. The library is what must
      # compile for the target, and RUSTFLAGS=-D warnings still fails on warnings.
      - name: cargo build (wasm32-wasip1, reqwest disabled)
        run: |
          for crate in \
            fiftyone-cloud-request-engine \
            fiftyone-device-detection-cloud \
            fiftyone-ip-intelligence-cloud \
            fiftyone-fodid-core \
            fiftyone-fodid-cloud \
            fiftyone-derived-properties \
            fiftyone-pipeline-translation \
            fiftyone-ip-intelligence-translation \
            fodid-client; do
            echo "::group::build ${crate}"
            cargo build -p "${crate}" --no-default-features --target wasm32-wasip1
            echo "::endgroup::"
          done

      # clippy over the same no-default-features wasm configuration lints the
      # reqwest-disabled code paths, which the native clippy job never sees
      # because the workspace build unifies reqwest-client on.
      - name: cargo clippy (wasm32-wasip1, reqwest disabled)
        run: |
          for crate in \
            fiftyone-cloud-request-engine \
            fiftyone-device-detection-cloud \
            fiftyone-ip-intelligence-cloud \
            fiftyone-fodid-core \
            fiftyone-fodid-cloud \
            fiftyone-derived-properties \
            fiftyone-pipeline-translation \
            fiftyone-ip-intelligence-translation \
            fodid-client; do
            echo "::group::clippy ${crate}"
            cargo clippy -p "${crate}" --no-default-features --target wasm32-wasip1 -- -D warnings
            echo "::endgroup::"
          done

      # wasmtime is the runner that actually executes the wasm test binaries the
      # next step builds. The action looks up the release with the workflow's
      # token, puts wasmtime on PATH and runs `wasmtime --version`, so a failed
      # install fails this step rather than the tests.
      - name: Install wasmtime (the wasm test runner)
        uses: bytecodealliance/actions/wasmtime/setup@v1

      # Run the wasm-safe test suites on the target under wasmtime, so the
      # pure-Rust logic is exercised on wasm and not merely compiled. cargo runs
      # each test binary through wasmtime via CARGO_TARGET_WASM32_WASIP1_RUNNER.
      # --no-default-features keeps reqwest out (the consumer supplies its own
      # client on wasm), which also gates out the live-cloud tests. The crate list
      # is the wasm-runnable set: the -sys / native / on-premise crates are
      # excluded for the structural reasons in the job comment above. Doctests run
      # here too and are exercised under wasmtime.
      - name: cargo test (wasm32-wasip1, executed under wasmtime)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: |
          for crate in \
            fiftyone-caching \
            fiftyone-pipeline-core \
            fiftyone-json-builder \
            fiftyone-javascript-builder \
            fiftyone-device-detection-shared \
            fiftyone-ip-intelligence-shared \
            fiftyone-device-detection-cloud \
            fiftyone-ip-intelligence-cloud \
            fiftyone-fodid-core \
            fiftyone-fodid-cloud \
            fiftyone-derived-properties \
            fiftyone-pipeline-translation \
            fiftyone-ip-intelligence-translation \
            fodid-client; do
            echo "::group::test ${crate}"
            cargo test -p "${crate}" --no-default-features --target wasm32-wasip1
            echo "::endgroup::"
          done

      # CountriesTranslationEngine compiles in the Unicode collation data for
      # every locale icu_collator holds, and edge platforms limit the size of
      # a deployed module. This builds a release module with and without the
      # engine, prints both sizes to the log and the run's summary, and runs
      # both under wasmtime. The crate README's figure comes from here.
      - name: Measure what the countries translation engine adds to a module
        run: bash ci/measure-wasm-size.sh

  # Two crates compile in files that come from submodules and are not
  # committed here, being the derived-properties scripts and the translations
  # in the data repository inside cxx. This writes what the publish workflow
  # writes before publishing, lists what cargo would publish for each of the
  # two, checks the shared files are in it and nothing else from the
  # submodules is, and then builds each crate from its own package, which has
  # no git and no submodule, as crates.io and docs.rs build it.
  package:
    name: package (shared files)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: package

      - name: Write the files the publish workflow writes
        shell: pwsh
        run: |
          ./ci/copy-translations.ps1
          ./ci/record-derived-properties-commit.ps1

      - name: Check and build the three packages
        run: bash ci/check-packages.sh
