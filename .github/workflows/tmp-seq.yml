name: tmp sequence data key test
on:
  push:
    branches: ['tmp/rust-seq-*']
jobs:
  test:
    name: web_integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p fiftyone-pipeline-web --test web_integration
