name: Temporary read timing on the head, alternated

on:
  push:
    branches:
      - 'tmp/timing-head-376'

jobs:
  Test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout before the change
        uses: actions/checkout@v4
        with:
          ref: 0c5755d7c376afd3784b8378fbf858d6582568c0
          path: before
          submodules: recursive
      - name: Checkout the head
        uses: actions/checkout@v4
        with:
          path: after
          submodules: recursive
      - name: Restore the data files
        uses: ./after/.github/actions/restore-data-files
        with:
          root: after
      - name: Download any data file not restored
        continue-on-error: true
        shell: pwsh
        working-directory: after
        run: ./cxx/data/get-data-files.ps1 51Degrees-LiteV4.1.hash 51Degrees-IPIV4AsnIpiV41.ipi
      - name: Configure data files
        shell: bash
        run: |
          echo "51DEGREES_DD_PATH=${GITHUB_WORKSPACE}/after/cxx/data/device-detection/51Degrees-LiteV4.1.hash" >> "$GITHUB_ENV"
          echo "51DEGREES_IPI_PATH=${GITHUB_WORKSPACE}/after/cxx/data/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi" >> "$GITHUB_ENV"
          for file in "${GITHUB_WORKSPACE}/after/cxx/data/device-detection/51Degrees-LiteV4.1.hash" "${GITHUB_WORKSPACE}/after/cxx/data/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              exit 1
            fi
          done
      - name: Build both in release
        run: |
          (cd before && cargo test --release -p fiftyone-ip-intelligence-onpremise --test read_timing --no-run)
          (cd after && cargo test --release -p fiftyone-ip-intelligence-onpremise --test read_timing --no-run)
      - name: Alternate before and after, eight rounds each
        run: |
          for round in 1 2 3 4 5 6 7 8; do
            for side in before after; do
              (cd $side && cargo test --release -p fiftyone-ip-intelligence-onpremise --test read_timing -- --nocapture --test-threads=1 2>&1) | grep -E "No names|Asn read" | sed "s/^/ROUND $round $side: /"
            done
          done
  DeviceDetection:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout before the change
        uses: actions/checkout@v4
        with:
          ref: ac382623782a6715aa76785eca1b180b01027513
          path: before
          submodules: recursive
      - name: Checkout the head
        uses: actions/checkout@v4
        with:
          path: after
          submodules: recursive
      - name: Restore the data files
        uses: ./after/.github/actions/restore-data-files
        with:
          root: after
      - name: Download any data file not restored
        continue-on-error: true
        shell: pwsh
        working-directory: after
        run: ./cxx/data/get-data-files.ps1 51Degrees-LiteV4.1.hash 51Degrees-IPIV4AsnIpiV41.ipi
      - name: Configure data files
        shell: bash
        run: |
          echo "51DEGREES_DD_PATH=${GITHUB_WORKSPACE}/after/cxx/data/device-detection/51Degrees-LiteV4.1.hash" >> "$GITHUB_ENV"
          echo "51DEGREES_IPI_PATH=${GITHUB_WORKSPACE}/after/cxx/data/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi" >> "$GITHUB_ENV"
          for file in "${GITHUB_WORKSPACE}/after/cxx/data/device-detection/51Degrees-LiteV4.1.hash" "${GITHUB_WORKSPACE}/after/cxx/data/ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              exit 1
            fi
          done
      - name: Build both in release
        run: |
          (cd before && cargo test --release -p fiftyone-device-detection-onpremise --test read_timing --no-run)
          (cd after && cargo test --release -p fiftyone-device-detection-onpremise --test read_timing --no-run)
      - name: Alternate before and after, eight rounds each
        run: |
          for round in 1 2 3 4 5 6 7 8; do
            for side in before after; do
              (cd $side && cargo test --release -p fiftyone-device-detection-onpremise --test read_timing -- --nocapture --test-threads=1 2>&1) | grep -E "No names|IsMobile read" | sed "s/^/ROUND $round $side: /"
            done
          done
